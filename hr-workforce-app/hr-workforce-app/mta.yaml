_schema-version: "3.2"
ID: hr-workforce-app
version: 1.0.0
description: "Employee Leave, Shift Scheduling & Overtime Management – SAP BTP"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --production
        - npx cds build --production

modules:
  # ---- HANA HDI container (database) ----
  - name: hr-workforce-db
    type: com.sap.xs.hdi-container
    path: gen/db
    parameters:
      service-name: hr-workforce-hdi
    requires:
      - name: hr-uaa

  # ---- CAP Node.js service (backend + OData V4) ----
  - name: hr-workforce-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 1G
    requires:
      - name: hr-uaa
      - name: hr-workforce-db
      - name: hr-srv-destination
        properties:
          name: hr-srv-api
          url: "~{url}"
          forwardAuthToken: true
    provides:
      - name: srv-api
        properties:
          url: ${default-url}

  # ---- Application Router (auth, routing, static UI) ----
  - name: hr-workforce-approuter
    type: nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 512M
    requires:
      - name: hr-uaa
      - name: srv-api
        group: destinations
        properties:
          name: hr-srv-api
          url: ~{url}
          forwardAuthToken: true
    properties:
      SAP_JWT_TRUST_ACL: []

resources:
  # ---- XSUAA security ----
  - name: hr-uaa
    type: com.sap.xs.uaa
    path: ./xs-security.json
    parameters:
      service-name: hr-workforce-uaa

  # ---- SAP HANA Cloud / HDI ----
  - name: hr-workforce-db
    type: com.sap.xs.hdi-container
    parameters:
      service-name: hr-workforce-hdi

  # ---- Destination service (integration / S/4HANA) ----
  - name: hr-srv-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: hr-workforce-destination
