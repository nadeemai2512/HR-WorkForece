_schema-version: '3.1'
ID: wfms
version: 1.0.0
description: "WFMS - Employee Leave, Shift Scheduling & Overtime Management System"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --production
        - npx cds build --production
        # copy the SAPUI5 app into the app router's static resources dir
        - rm -rf approuter/resources && mkdir -p approuter/resources
        - cp -r app/wfms-ui/* approuter/resources/

modules:
  # ---------- HANA HDI database ----------
  - name: wfms-db
    type: com.sap.xs.hdi-datasource
    path: gen/db
    parameters:
      config:
        schema: WFMS_HDI
        makeUniqueName: false
    requires:
      - name: wfms-hana
      - name: wfms-uaa

  # ---------- CAP backend (Node.js) ----------
  - name: wfms-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 512M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: wfms-hana
      - name: wfms-uaa
      - name: wfms-destination

  # ---------- Application Router ----------
  - name: wfms-app
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
    requires:
      - name: wfms-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
    provides:
      - name: app
        properties:
          app-url: ${default-url}

resources:
  - name: wfms-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: wfms-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: wfms-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
